<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Staf — Daun Teh Nusantara</title><style>
:root{font:16px system-ui,sans-serif;color:#1a1d15;background:#edf0e8;--green:#506b24;--soft:#eaf2de;--line:#e1e6da;--muted:#60665b}*{box-sizing:border-box}body{margin:0;padding:24px}h1{font-size:1.5rem}h2{font-size:1.75rem;margin:0 0 12px}h3{font-size:1.1rem}p{line-height:1.55}a{color:var(--green)}button,input,select,textarea{font:inherit}button,select{min-height:48px;border:1px solid #8e9884;border-radius:12px;background:white;padding:10px 14px;color:inherit}button{cursor:pointer}button:disabled{opacity:.48;cursor:default}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #718c41;outline-offset:3px}button.primary{background:var(--green);border-color:var(--green);color:white}button.danger{color:#9f332c;border-color:#9f332c}label{display:grid;gap:6px}textarea{width:100%;min-height:110px;border:1px solid #8e9884;border-radius:12px;padding:12px}code{font-size:.85rem;overflow-wrap:anywhere;user-select:all}small,.muted{color:var(--muted)}.tools,.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.tools{margin:20px 0}.device{container-type:inline-size;background:white;border:1px solid var(--line);border-radius:24px;overflow:hidden;margin:auto}.phone{max-width:410px}.tablet{max-width:1180px}.shell{display:flex}.rail{width:140px;flex-shrink:0;background:#f7f9f3;padding:20px 12px;display:grid;align-content:start;gap:22px}.current{font-weight:700;color:var(--green);background:var(--soft);border-radius:12px;padding:10px}.workspace{flex:1;min-width:0}.context{background:#f1f4ec;padding:20px;display:flex;gap:12px;align-items:center}.context small{display:block;margin-top:5px}.icon{width:24px;height:24px;fill:currentColor;flex-shrink:0}.main{padding:24px}.notice{background:#f1f5eb;border-radius:14px;padding:14px;line-height:1.55}.notice.warning{background:#fff2dc}.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0}.tabs [aria-selected=true]{background:var(--soft);border-color:var(--green);font-weight:650}.layout{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(250px,1fr);gap:24px}.row{padding:18px 0;border-bottom:1px solid var(--line);display:grid;gap:10px;overflow-wrap:anywhere}.row strong{font-size:1.1rem}.row .actions{margin-top:4px}.pill{display:inline-block;align-self:start;justify-self:start;background:var(--soft);border-radius:8px;padding:5px 9px;font-size:.85rem}.revoked{background:#fce8e5;color:#93342d}.bottom{display:none;background:#f7f9f3;border-top:1px solid var(--line);padding:12px;justify-content:space-around;gap:5px;font-size:.8rem}.dialog-overlay{position:fixed;inset:0;background:#17201288;display:grid;place-items:center;padding:16px;z-index:10}.dialog{background:white;border-radius:24px;max-width:560px;width:100%;max-height:90dvh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 16px 50px #0003}.dialog-body{overflow:auto;padding:24px}.dialog-footer{border-top:1px solid var(--line);padding:16px 24px;display:flex;flex-wrap:wrap;gap:10px}.error{color:#a2322b}.surface-note{max-width:1180px;margin:16px auto;color:var(--muted)}.help{border-left:3px solid var(--green);padding:0 0 0 18px;align-self:start}.large{font-size:200%}.large .layout{display:block}.large .help{margin-top:24px}.large .row button{width:100%}
@container(max-width:750px){.layout{display:block}.help{margin-top:28px}}@container(max-width:599px){.rail{display:none}.bottom{display:flex}.main{padding:20px 16px}.actions>button{flex-grow:1}.context{padding:16px}}@media(max-width:600px){body{padding:12px}.tools label{width:100%}.dialog-overlay{padding:8px;align-items:end}.dialog{max-height:94dvh;border-radius:24px 24px 8px 8px}.dialog-footer button{flex:1}}
</style></head><body>
<h1>Staf & akses · rancangan interaktif</h1><p>Contoh fiktif untuk S-01–S-03. Tidak terhubung ke Supabase atau Android.</p>
<div class="tools"><button id="phone">Telepon</button><button id="tablet">Tablet</button><button id="large">Teks 200%</button><label>Peninjau<select id="actor"><option value="OWNER">Pemilik</option><option value="MANAGER">Pengelola</option><option value="CASHIER">Kasir</option></select></label><label>Outlet operasional<select id="source"><option value="a">Outlet A</option><option value="b">Outlet B</option></select></label><label>Keadaan<select id="scenario"><option value="ready">Siap</option><option value="empty">Daftar kosong</option><option value="loading">Memuat</option><option value="offline">Offline</option><option value="error">Gagal memuat</option><option value="large">Daftar terlalu besar</option><option value="denied">Akses ditolak</option></select></label></div>
<div class="tools"><label>Hasil permintaan contoh<select id="outcome"><option value="success">Diterima + daftar baru</option><option value="conflict">Konflik versi</option><option value="uncertain">Respons hilang setelah commit</option><option value="ack-error">Diterima; pembacaan gagal</option></select></label><button id="complete">Selesaikan simulasi</button><button id="late">Respons lama</button><button id="reset">Reset contoh</button></div>
<div class="device phone" id="device"><div id="scene"></div></div><p class="surface-note">Fiktif, bukan screenshot Android. Seluruh perubahan hanya di memori halaman ini. <a href="../STAFF_SCREEN_DESIGNS.md">Kontrak & rencana implementasi</a> · Ikon Material Symbols Rounded: <a href="../MATERIAL_SYMBOLS_SOURCES.md">atribusi</a></p><div id="modal"></div>
<script>
'use strict';
const $=q=>document.querySelector(q),clone=x=>structuredClone(x),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const role=x=>({OWNER:'Pemilik',MANAGER:'Pengelola',CASHIER:'Kasir'}[x]||'Akses anggota perlu ditinjau');
let actor='OWNER',source='a',mode='phone',large=false,generation=0,sequence=0,s,db,late=null;
const deviceId=n=>`00000000-0000-4000-8000-${String(n).padStart(12,'0')}`;
function fixture(){return {members:[{id:'00000000-0000-4000-9000-000000000001',name:'Rani Putri',email:'rani@example.invalid',role:'CASHIER',active:true,profile:true,version:1},{id:'00000000-0000-4000-9000-000000000002',name:'Bima Pratama',email:'bima@example.invalid',role:'MANAGER',active:true,profile:true,version:1},{id:'00000000-0000-4000-9000-000000000003',name:'Sari Wulandari',email:'sari@example.invalid',role:'CASHIER',active:false,profile:false,version:1}],devices:[{id:deviceId(1),userId:'00000000-0000-4000-9000-000000000001',role:'CASHIER',revoked:false,approved:true,version:1},{id:deviceId(2),userId:'00000000-0000-4000-9000-000000000002',role:'MANAGER',revoked:true,approved:false,version:1},{id:deviceId(3),userId:'00000000-0000-4000-9000-000000000003',role:null,revoked:true,approved:true,version:1},{id:deviceId(9),userId:'00000000-0000-4000-9000-000000000009',role:'OWNER',revoked:false,approved:true,version:1}],audit:[{label:'Akun ditugaskan ke outlet',target:'00000000-0000-4000-9000-000000000001',reason:null}]};}
function reset(scene='ready'){if(s?.request)late=clone(s.request);generation++;db=fixture();if(scene==='empty')db={members:[],devices:[],audit:[]};s={scene,tab:'members',roster:['offline','loading','error','large','denied'].includes(scene)?null:clone(db),modal:null,reason:'',busy:scene==='loading',request:null,blocked:false,message:'',approvedLoaded:false,approvalRows:[]};render();}
const online=()=>!['offline','denied'].includes(s.scene)&&actor!=='CASHIER';
const mayMember=m=>m.id!==(actor==='MANAGER'?'00000000-0000-4000-9000-000000000002':'00000000-0000-4000-9000-000000000009')&&(actor==='OWNER'||actor==='MANAGER'&&m.role==='CASHIER')&&(m.active||m.profile);
const mayDevice=d=>d.id!==deviceId(9)&&(d.revoked?actor==='OWNER'&&d.role!==null:actor==='OWNER'||actor==='MANAGER'&&d.role==='CASHIER');
function target(kind,id){return s.roster?.[kind==='member'?'members':'devices'].find(x=>x.id===id);}
function open(kind,id){const row=target(kind,id);if(!row||!online()||s.busy||s.blocked||!(kind==='member'?mayMember(row):mayDevice(row)))return;s.modal={kind,target:clone(row),generation,desired:kind==='member'?!row.active:!row.revoked};s.reason='';render();$('#reason').focus();}
function title(m){return m.kind==='member'?(m.desired?'Aktifkan akses outlet':'Nonaktifkan akses outlet'):(m.desired?'Cabut akses perangkat':'Pulihkan ke menunggu persetujuan');}
function effect(m){return m.kind==='member'?(m.desired?'Perangkat yang dicabut tetap dicabut. Pemilik perlu memulihkan perangkat, lalu persetujuan baru tetap diperlukan.':'Akses outlet dinonaktifkan dan perangkat anggota di outlet ini dicabut. Perangkat terputus dapat tetap memakai izin offline hingga validasi online atau masa izin berakhir.'):(m.desired?'Perangkat dicabut. Ini tidak menghapus struk atau menjamin logout seketika ketika offline.':'Kembali ke menunggu persetujuan, bukan aktif. Persetujuan baru sesuai peran tetap diperlukan.');}
function send(){const m=s.modal,row=m&&target(m.kind,m.target.id);if(!m||m.generation!==generation||s.busy||!online()||s.reason.trim().length<3||s.reason.trim().length>240)return;if(!row||row.version!==m.target.version){s.modal=null;s.blocked=true;s.message='Data berubah. Perbarui dan tinjau kembali.';render();return;}s.request={...clone(m),id:++sequence,reason:s.reason.trim(),actor,source};s.busy=true;render();}
function commit(req){const rows=req.kind==='member'?db.members:db.devices,row=rows.find(x=>x.id===req.target.id);if(!row)return;if(req.kind==='member'){row.active=req.desired;row.version++;if(!row.active)db.devices.filter(d=>d.userId===row.id).forEach(d=>{d.revoked=true;d.role=null;d.version++});else db.devices.filter(d=>d.userId===row.id).forEach(d=>d.role=row.role);}else{row.revoked=req.desired;row.approved=false;row.version++;}db.audit.unshift({label:title(req),target:row.id,reason:req.reason});}
function finish(outcome,req=s.request){if(!req||req.generation!==generation||s.request?.id!==req.id||!online())return;s.busy=false;s.request=null;s.modal=null;s.reason='';if(outcome==='conflict'){s.blocked=true;s.message='Data berubah di server. Perbarui dan tinjau target kembali; tidak ada penimpaan paksa.';}else{commit(req);if(outcome==='success'){s.roster=clone(db);s.message='Perubahan diterima dan daftar diperbarui.';}else{s.blocked=true;s.message=outcome==='uncertain'?'Hasil belum dapat dipastikan. Perbarui dan periksa akses sebelum mencoba lagi.':'Perubahan diterima; daftar belum diperbarui. Perbarui daftar saja.';}}render();}
function reload(){if(!online()||s.busy)return;s.roster=clone(db);s.scene='ready';s.blocked=false;s.modal=null;s.reason='';s.message='Daftar dibaca ulang. Tinjau keadaan saat ini sebelum tindakan baru.';render();}
function memberRows(){return s.roster.members.map(m=>`<section class="row"><strong>${esc(m.name)}</strong><span>${esc(m.email)}</span><small>${role(m.role)}</small><span class="pill ${!m.active||!m.profile?'revoked':''}">${!m.profile?'Profil nonaktif · tinjau administrator':m.active?'Akses outlet aktif':'Akses outlet nonaktif'}</span>${!m.profile?`<small>Keanggotaan outlet ${m.active?'aktif':'nonaktif'}; profil terpisah.</small>`:''}${mayMember(m)?`<div class="actions"><button data-kind="member" data-id="${m.id}" ${s.busy||s.blocked?'disabled':''}>${m.active?'Nonaktifkan':'Aktifkan'} akses outlet</button></div>`:'<small>Tidak dapat diubah melalui akun ini.</small>'}</section>`).join('')||'<p>Belum ada anggota yang dikembalikan untuk outlet ini.</p>';}
function deviceRows(){const rows=s.roster.devices.filter(d=>actor==='OWNER'||d.role==='CASHIER');return (rows.map(d=>`<section class="row"><strong>${esc(s.roster.members.find(m=>m.id===d.userId)?.name||d.userId)}</strong><code>${d.id}</code><small>${role(d.role)}${d.id===deviceId(9)?' · Perangkat ini':''}</small><span class="pill ${d.revoked?'revoked':''}">${d.revoked?'Dicabut':d.approved?'Disetujui':'Menunggu persetujuan'}</span>${mayDevice(d)?`<div class="actions"><button data-kind="device" data-id="${d.id}" ${s.busy||s.blocked?'disabled':''}>${d.revoked?'Pulihkan ke menunggu persetujuan':'Cabut akses perangkat'}</button></div>`:`<small>${d.id===deviceId(9)?'Perangkat ini tidak dapat dicabut di sini.':d.role===null?'Tinjau akses anggota terlebih dahulu.':'Pemulihan hanya oleh Pemilik.'}</small>`}</section>`).join('')||'<p>Belum ada perangkat yang dikembalikan.</p>')+`<section class="notice"><h3>Permintaan persetujuan · A-07/A-08</h3><p>Pemuatan terpisah dari daftar perangkat.</p><button id="requests" ${s.busy||s.blocked?'disabled':''}>Muat permintaan contoh</button><p>${s.approvedLoaded?(s.approvalRows.length?'Permintaan contoh: '+s.approvalRows.map(d=>esc(d.userId)).join(', ')+'. Tinjau melalui alur A-08 terpisah.':'Contoh: tidak ada permintaan yang dikembalikan.'):'Belum dimuat. Gunakan alur tinjau identitas sebelum menyetujui.'}</p></section>`;}
function content(){if(actor==='CASHIER'||s.scene==='denied')return '<h2>Staf tidak tersedia</h2><p class="notice">Akses perlu divalidasi sesuai peran. Data sebelumnya tidak ditampilkan.</p>';return `<h2>Staf</h2><p>Kelola akses untuk outlet yang dipilih.</p><div class="actions"><button id="reload" ${!online()||s.busy?'disabled':''}>Perbarui</button></div>${s.message?`<p role="status" class="notice warning">${esc(s.message)}</p>`:''}${s.scene==='offline'?'<p class="notice">Pengelolaan staf memerlukan koneksi. Data dan draf sebelumnya tidak ditampilkan.</p>':s.scene==='loading'?'<p class="notice" role="status">Memuat daftar staf…</p>':s.scene==='large'?'<p class="notice">Daftar terlalu besar. Hubungi administrator untuk peninjauan.</p>':s.scene==='error'?'<p class="notice">Daftar belum dapat dimuat. Coba perbarui.</p>':''}${s.roster?`<div class="tabs" role="tablist" aria-label="Bagian staf">${[['members','Anggota'],['devices','Perangkat'],...(actor==='OWNER'?[['audit','Aktivitas akses']]:[])].map(([key,label])=>`<button role="tab" aria-selected="${s.tab===key}" data-tab="${key}">${label}</button>`).join('')}</div><div class="layout"><section aria-label="Daftar">${s.tab==='members'?memberRows():s.tab==='devices'?deviceRows():`<h3>Hingga 50 aktivitas akses outlet yang dikembalikan</h3>${s.roster.audit.map(a=>`<section class="row"><strong>${esc(a.label)}</strong><span>15 Nov 2026 · 12.00 WIB · contoh</span>${a.reason?`<p>${esc(a.reason)}</p>`:''}<code>00000000-0000-4000-9000-000000000009 → ${esc(a.target)}</code></section>`).join('')||'<p>Tidak ada aktivitas yang dikembalikan.</p>'}`}</section><aside class="help"><h3>Akun ditambahkan oleh administrator</h3><p>Hubungi administrator untuk akun, peran atau kata sandi. Tidak ada undangan atau pendaftaran di aplikasi.</p><p class="muted">Perubahan berlaku untuk outlet yang dipilih. Izin offline perangkat terputus tetap dibatasi masa izin yang sudah ada.</p></aside></div>`:''}`;}
function modal(){const host=$('#modal');$('#device').inert=!!s.modal;if(!s.modal){host.innerHTML='';return;}const m=s.modal;host.innerHTML=`<div class="dialog-overlay"><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title"><div class="dialog-body"><h2 id="dialog-title">${title(m)}?</h2><p>${esc(m.target.name||m.target.userId)} · ${role(m.target.role)}</p>${m.target.email?`<p>${esc(m.target.email)}</p>`:''}<code>${esc(m.target.id)}</code><p>Outlet ${source.toUpperCase()} · ${m.kind==='member'?(m.target.active?'Aktif → Nonaktif':'Nonaktif → Aktif'):(m.target.revoked?'Dicabut → Menunggu persetujuan':'Akses perangkat → Dicabut')}</p><p class="notice warning">${effect(m)}</p><label>Alasan perubahan<textarea id="reason" ${s.busy?'disabled':''}>${esc(s.reason)}</textarea></label><p class="muted">3–240 karakter setelah spasi tepi dihapus. Alasan dicatat; hindari kata sandi atau rahasia.</p><p id="validation" class="error"></p>${s.busy?'<p role="status">Mengirim perubahan contoh… Hasil contoh, bukan permintaan nyata.</p><div class="actions"><button data-finish="success">Simulasi diterima</button><button data-finish="conflict">Simulasi konflik</button><button data-finish="uncertain">Simulasi respons hilang</button><button data-finish="ack-error">Simulasi daftar gagal</button></div>':''}</div><footer class="dialog-footer"><button id="cancel" ${s.busy?'disabled':''}>Batal</button><button id="send" class="${m.kind==='member'&&!m.desired||m.kind==='device'&&m.desired?'danger':'primary'}">${s.busy?'Mengirim…':title(m)}</button></footer></section></div>`;validity();}
function validity(){const reason=s.reason.trim(),valid=reason.length>=3&&reason.length<=240;$('#send').disabled=!valid||s.busy;$('#validation').textContent=!valid?'Masukkan alasan sepanjang 3–240 karakter.':'';}
function render(){const nav='<span>Ringkasan</span><span>Katalog</span><span>Laporan</span><span class="current">Staf</span><span>Setelan</span>';$('#device').className=`device ${mode}${large?' large':''}`;$('#phone').setAttribute('aria-pressed',mode==='phone');$('#tablet').setAttribute('aria-pressed',mode==='tablet');$('#large').setAttribute('aria-pressed',large);$('#complete').disabled=!s.request;$('#late').disabled=!late;$('#scene').innerHTML=`<div class="shell"><nav class="rail" aria-label="Navigasi contoh">${actor==='CASHIER'?'Kasir · Riwayat · Setelan':nav}</nav><div class="workspace"><header class="context"><svg class="icon" aria-hidden="true" viewBox="0 0 960 960"><path d="M201,840Q168,840 144.5,816.5Q121,793 121,760L121,442Q98,421 85.5,388Q73,355 85,316L127,180Q135,154 155.5,137Q176,120 203,120L759,120Q786,120 806,136.5Q826,153 835,180L877,316Q889,355 876.5,387Q864,419 841,442L841,760Q841,793 817.5,816.5Q794,840 761,840L201,840ZM569,400Q596,400 610,381.5Q624,363 621,340L599,200L521,200L521,348Q521,369 535,384.5Q549,400 569,400ZM389,400Q412,400 426.5,384.5Q441,369 441,348L441,200L363,200L341,340Q337,364 351.5,382Q366,400 389,400ZM211,400Q229,400 242.5,387Q256,374 259,354L281,200L203,200Q203,200 203,200Q203,200 203,200L163,334Q157,354 169.5,377Q182,400 211,400ZM751,400Q780,400 793,377Q806,354 799,334L757,200Q757,200 757,200Q757,200 757,200L681,200L703,354Q706,374 719.5,387Q733,400 751,400ZM201,760L761,760Q761,760 761,760Q761,760 761,760L761,478Q756,480 754.5,480Q753,480 751,480Q724,480 703.5,471Q683,462 663,442Q645,460 622,470Q599,480 573,480Q546,480 522.5,470Q499,460 481,442Q464,460 441.5,470Q419,480 393,480Q364,480 340.5,470Q317,460 299,442Q278,463 257.5,471.5Q237,480 211,480Q209,480 206.5,480Q204,480 201,478L201,760Q201,760 201,760Q201,760 201,760ZM761,760L201,760Q201,760 201,760Q201,760 201,760L201,760Q204,760 206.5,760Q209,760 211,760Q237,760 257.5,760Q278,760 299,760Q308,760 318.5,760Q329,760 341,760Q353,760 366,760Q379,760 393,760Q406,760 418,760Q430,760 441.5,760Q453,760 463,760Q473,760 481,760Q499,760 522.5,760Q546,760 573,760Q586,760 598,760Q610,760 621.5,760Q633,760 643.5,760Q654,760 663,760Q683,760 703.5,760Q724,760 751,760Q753,760 754.5,760Q756,760 761,760L761,760Q761,760 761,760Q761,760 761,760Z"/></svg><div><strong>Outlet ${source.toUpperCase()}</strong><small>${role(actor)} · ${s.scene==='offline'?'Akses offline contoh':'Akses online contoh'}</small></div></header><main class="main">${content()}</main><nav class="bottom" aria-label="Navigasi contoh">${actor==='CASHIER'?'Kasir · Riwayat · Setelan':nav}</nav></div></div>`;modal();}
$('#scene').onclick=e=>{const b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.tab){s.tab=b.dataset.tab;render();}else if(b.dataset.kind)open(b.dataset.kind,b.dataset.id);else if(b.id==='reload')reload();else if(b.id==='requests'){s.approvedLoaded=true;s.approvalRows=clone(db.devices.filter(d=>!d.revoked&&!d.approved&&d.role&&(actor==='OWNER'||d.role==='CASHIER')));render();}};
function cancel(){if(s.busy||!s.modal)return;const id=s.modal.target.id;s.modal=null;s.reason='';render();[...$('#scene').querySelectorAll('[data-id]')].find(b=>b.dataset.id===id)?.focus();}
$('#modal').onclick=e=>{if(e.target.dataset.finish)finish(e.target.dataset.finish);else if(e.target.id==='cancel')cancel();else if(e.target.id==='send')send();};$('#modal').oninput=e=>{if(e.target.id==='reason'){s.reason=e.target.value;validity();}};
document.addEventListener('keydown',e=>{if(!s.modal)return;if(e.key==='Escape'){e.preventDefault();cancel();}else if(e.key==='Tab'){const nodes=[...$('#modal').querySelectorAll('button,textarea')].filter(n=>!n.disabled);if(!nodes.length)return;if(e.shiftKey&&document.activeElement===nodes[0]){e.preventDefault();nodes.at(-1).focus();}else if(!e.shiftKey&&document.activeElement===nodes.at(-1)){e.preventDefault();nodes[0].focus();}}});
$('#actor').onchange=e=>{actor=e.target.value;$('#scenario').value='ready';reset();};$('#source').onchange=e=>{source=e.target.value;$('#scenario').value='ready';reset();};$('#scenario').onchange=e=>reset(e.target.value);$('#phone').onclick=()=>{mode='phone';render();};$('#tablet').onclick=()=>{mode='tablet';render();};$('#large').onclick=()=>{large=!large;render();};$('#reset').onclick=()=>{$('#scenario').value='ready';reset();};$('#complete').onclick=()=>finish($('#outcome').value);$('#late').onclick=()=>finish('success',late);window.staffDemo={snapshot:()=>clone(s),finishLate:()=>finish('success',late)};reset();
</script></body></html>
