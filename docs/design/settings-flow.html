<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Setelan — Daun Teh Nusantara</title><style>
:root{font:16px system-ui,sans-serif;color:#1a1d15;background:#edf0e8;--green:#506b24;--soft:#eaf2de;--line:#e1e6da;--muted:#60665b}*{box-sizing:border-box}body{margin:0;padding:24px}h1{font-size:1.5rem}h2{font-size:1.75rem;margin:0 0 12px}h3{font-size:1.1rem}p{line-height:1.55}a{color:var(--green)}button,input,select,textarea{font:inherit}button,select{min-height:48px;border:1px solid #8e9884;border-radius:12px;background:white;padding:10px 14px;color:inherit}button{cursor:pointer}button:disabled{opacity:.48;cursor:default}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #718c41;outline-offset:3px}button.primary{background:var(--green);border-color:var(--green);color:white}button.danger{color:#9f332c;border-color:#9f332c}label{display:grid;gap:6px}textarea{width:100%;min-height:110px;border:1px solid #8e9884;border-radius:12px;padding:12px}code{font-size:.85rem;overflow-wrap:anywhere;user-select:all}small,.muted{color:var(--muted)}.tools,.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.tools{margin:20px 0}.device{container-type:inline-size;background:white;border:1px solid var(--line);border-radius:24px;overflow:hidden;margin:auto}.phone{max-width:410px}.tablet{max-width:1180px}.shell{display:flex}.rail{width:140px;flex-shrink:0;background:#f7f9f3;padding:20px 12px;display:grid;align-content:start;gap:22px}.current{font-weight:700;color:var(--green);background:var(--soft);border-radius:12px;padding:10px}.workspace{flex:1;min-width:0}.context{background:#f1f4ec;padding:20px;display:flex;gap:12px;align-items:center}.context small{display:block;margin-top:5px}.icon{width:24px;height:24px;fill:currentColor;flex-shrink:0}.main{padding:24px}.notice{background:#f1f5eb;border-radius:14px;padding:14px;line-height:1.55}.notice.warning{background:#fff2dc}.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0}.tabs [aria-selected=true]{background:var(--soft);border-color:var(--green);font-weight:650}.layout{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(250px,1fr);gap:24px}.row{padding:18px 0;border-bottom:1px solid var(--line);display:grid;gap:10px;overflow-wrap:anywhere}.row strong{font-size:1.1rem}.row .actions{margin-top:4px}.pill{display:inline-block;align-self:start;justify-self:start;background:var(--soft);border-radius:8px;padding:5px 9px;font-size:.85rem}.revoked{background:#fce8e5;color:#93342d}.bottom{display:none;background:#f7f9f3;border-top:1px solid var(--line);padding:12px;justify-content:space-around;gap:5px;font-size:.8rem}.dialog-overlay{position:fixed;inset:0;background:#17201288;display:grid;place-items:center;padding:16px;z-index:10}.dialog{background:white;border-radius:24px;max-width:560px;width:100%;max-height:90dvh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 16px 50px #0003}.dialog-body{overflow:auto;padding:24px}.dialog-footer{border-top:1px solid var(--line);padding:16px 24px;display:flex;flex-wrap:wrap;gap:10px}.error{color:#a2322b}.surface-note{max-width:1180px;margin:16px auto;color:var(--muted)}.help{border-left:3px solid var(--green);padding:0 0 0 18px;align-self:start}.large{font-size:200%}.large .layout{display:block}.large .help{margin-top:24px}.large .row button{width:100%}
@container(max-width:750px){.layout{display:block}.help{margin-top:28px}}@container(max-width:599px){.rail{display:none}.bottom{display:flex}.main{padding:20px 16px}.actions>button{flex-grow:1}.context{padding:16px}}@media(max-width:600px){body{padding:12px}.tools label{width:100%}.dialog-overlay{padding:8px;align-items:end}.dialog{max-height:94dvh;border-radius:24px 24px 8px 8px}.dialog-footer button{flex:1}}

.settings-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}.group{padding:18px 0;border-bottom:1px solid var(--line);min-width:0}.group h3{display:flex;align-items:center;gap:10px}.metric-list{display:grid;grid-template-columns:1fr auto;gap:12px}.metric-list strong{text-align:right}.large .settings-grid{display:block}@container(max-width:799px){.settings-grid{display:block}}
.large h2{font-size:1.75em}.large h3{font-size:1.1em}.large small,.large code{font-size:.85em}.large .bottom{font-size:.8em;flex-wrap:wrap}
</style></head><body>
<h1>Setelan, sinkronisasi & pemulihan · rancangan interaktif</h1><p>Contoh fiktif T-01–T-04 / X-03. Tidak ada file dibuat, akses diubah atau data dihapus.</p>
<div class="tools"><button id="phone">Telepon</button><button id="tablet">Tablet</button><button id="large">Teks 200%</button><label>Akun contoh<select id="actor"><option value="CASHIER">Kasir</option><option value="MANAGER">Pengelola</option><option value="OWNER">Pemilik</option></select></label><label>Outlet operasional<select id="source"><option value="a">Outlet A</option><option value="b">Outlet B</option></select></label><label>Keadaan<select id="scenario"><option value="ready">Antrean tersimpan</option><option value="empty">Antrean kosong</option><option value="loading">Memuat status</option><option value="error">Status tidak terbaca</option><option value="offline">Izin offline valid</option><option value="recovery">Server dipulihkan</option><option value="denied">Akses tidak berlaku</option></select></label><button id="late">Respons lama</button><button id="advance">Antrean berubah</button><button id="reset">Reset</button></div>
<div id="device" class="device phone"><div id="scene"></div></div><p class="surface-note">Fiktif, bukan screenshot Android. <a href="../SETTINGS_SCREEN_DESIGNS.md">Kontrak & rencana implementasi</a>. Ikon: <a href="../MATERIAL_SYMBOLS_SOURCES.md">Material Symbols Rounded</a>.</p><div id="modal"></div>
<script>
'use strict';
const $=q=>document.querySelector(q),clone=x=>structuredClone(x),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const names={CASHIER:'Kasir',MANAGER:'Pengelola',OWNER:'Pemilik'},deviceId='00000000-0000-4000-8000-000000000001';
let actor='CASHIER',source='a',mode='phone',large=false,generation=0,sequence=0,s,late=null;
function reset(scene='ready'){if(s?.request)late=clone(s.request);else if(s?.prepared)late=clone(s.prepared);generation++;s={scene,counts:['loading','error','denied'].includes(scene)?null:scene==='empty'?{pending:0,retrying:0,auth:0,review:0,synced:0}:{pending:2,retrying:1,auth:1,review:1,synced:9},pull:scene==='empty'?null:'15 Nov 2026 · 12.00 WIB',modal:null,busy:null,request:null,prepared:null,lastExport:null,message:'',signedOut:false};render();}
const allowed=()=>s.scene!=='denied'&&!s.signedOut,online=()=>allowed()&&s.scene!=='offline';
const identity=()=>({actor,source,email:actor.toLowerCase()+'@example.invalid',deviceId,generation});
function request(kind){if(s.busy||!allowed())return;if((kind==='retry'||kind==='validate')&&!online())return;if(kind==='retry'&&s.scene==='recovery')return;s.busy=kind;s.request={...identity(),id:++sequence,kind};s.message='';render();}
function finish(outcome='success',req=s.request){if(!req||req.generation!==generation||s.request?.id!==req.id||!allowed())return;s.request=null;s.busy=null;if(outcome!=='success'){s.message='Permintaan belum berhasil. Status tersimpan tidak dianggap baru.';render();return;}
 if(req.kind==='retry')s.message='Pengiriman dijadwalkan; tunggu status berubah. Ini bukan konfirmasi diterima server.';
 else if(req.kind==='validate')s.message='Validasi akses contoh selesai. Ini tidak menghapus status pemulihan atau memperpanjang izin dengan sendirinya.';
 else if(req.kind==='read'){s.counts={pending:2,retrying:1,auth:1,review:1,synced:9};s.scene='ready';s.message='Status contoh dibaca ulang.';}
 else if(req.kind==='capture'){s.prepared={...clone(req),capturedAt:'15 Nov 2026 · 12.05 WIB',counts:clone(s.counts),kind:'LOCAL_RECOVERY',originalIds:true};s.modal='picker';}
 else if(req.kind==='write'){s.lastExport=clone(s.prepared);s.prepared=null;s.modal=null;s.message='Simulasi arsip selesai di lokasi yang dipilih. Lindungi salinannya. Tidak ada file dibuat.';}
 render();}
function openExport(){if(!allowed()||s.busy)return;s.modal='explain';render();focusModal();}
function cancel(){if(s.busy)return;const previous=s.modal;s.modal=null;s.prepared=null;render();$('#scene [data-action="'+(previous==='signout'?'signout':'export')+'"]')?.focus();}
function startCapture(){if(!allowed()||s.busy)return;request('capture');s.modal='capture';render();focusModal();}
function startWrite(){if(!s.prepared||s.prepared.generation!==generation||s.busy||!allowed())return;s.busy='write';s.request={...identity(),id:++sequence,kind:'write'};s.modal='write';render();focusModal();}
function failExport(code){if(!allowed())return;s.request=null;s.prepared=null;s.busy=null;s.modal=null;s.message=code==='large'?'Arsip melebihi 16 MiB. Tidak ada pemotongan data; hubungi operator untuk ekstraksi yang ditinjau.':'Ekspor gagal. Buang file kosong/parsial dan pilih tujuan baru untuk mencoba lagi.';render();}
function queue(){if(s.counts===null)return `<p class="notice">${s.scene==='loading'?'Memuat status…':'Status antrean belum dapat dibaca. Jumlah belum tersedia.'}</p><button data-action="read" ${s.busy?'disabled':''}>Muat ulang status</button>`;const c=s.counts;return `<div class="metric-list"><span>Menunggu pengiriman</span><strong>${c.pending+c.retrying}</strong><span>Perlu validasi akses</span><strong>${c.auth}</strong><span>Perlu ditinjau</span><strong>${c.review}</strong><span>Diterima server · status lokal</span><strong>${c.synced}</strong></div>${c.pending+c.retrying+c.auth+c.review+c.synced===0?'<p>Tidak ada operasi yang dikembalikan untuk cakupan ini.</p>':''}<p class="muted">Unduhan berhasil terakhir: ${s.pull||'belum tersedia'}. Bukan waktu unggah atau cadangan.</p>${c.review?'<p class="notice warning">Perlu ditinjau: struk asli tetap disimpan. Tidak ada penggantian harga atau pengiriman ulang otomatis.</p>':''}<button data-action="retry" ${!online()||s.busy||s.scene==='recovery'?'disabled':''}>Coba pengiriman ulang</button>`;}
function content(){if(!allowed())return `<h2>${s.signedOut?'Sesi contoh berakhir':'Akses perlu divalidasi'}</h2><p class="notice">${s.signedOut?'Izin masuk lokal dihapus dalam simulasi. Struk dan antrean tetap disimpan. Masuk kembali memerlukan akun dan perangkat yang berwenang.':'Data sebelumnya tidak ditampilkan. Arsip memerlukan akses yang berlaku; hubungi pemilik/operator tanpa menghapus data.'}</p>`;
 return `<h2>Setelan</h2>${s.scene==='offline'?'<p class="notice">Akses offline contoh masih berlaku. Tindakan jaringan memerlukan koneksi; ekspor lokal tetap memeriksa izin.</p>':''}${s.scene==='recovery'?'<section class="notice warning"><h3>Data server perlu direkonsiliasi</h3><p>Struk dan antrean lokal tetap disimpan. Jangan hapus data aplikasi. Penjualan baru tetap dibatasi hingga pemulihan ditinjau.</p><p>Ekspor data perangkat, lalu hubungi pemilik/operator. Login atau ekspor tidak menghapus status ini.</p></section>':''}${s.message?`<p class="notice" role="status">${esc(s.message)}</p>`:''}${s.busy&&['retry','validate','read'].includes(s.busy)?`<p role="status" class="notice">${s.busy==='retry'?'Menjadwalkan pengiriman…':s.busy==='read'?'Membaca status…':'Memvalidasi akses…'} <button data-finish="success">Simulasi selesai</button><button data-finish="error">Simulasi gagal</button></p>`:''}<div class="settings-grid"><div><section class="group"><h3>Akun & akses</h3><p>${esc(identity().email)}</p><p>Izin offline berlaku hingga 15 Des 2026 · 12.00 WIB · contoh.</p><details><summary>Identitas perangkat</summary><p><code>${deviceId}</code></p><p>UUID publik, bukan model perangkat atau rahasia.</p></details><p class="muted">Maksimal satu bulan kalender sesuai izin server. Boot, waktu dan kunci perangkat tetap diperiksa.</p><button data-action="validate" ${!online()||s.busy?'disabled':''}>Validasi akses online</button></section><section class="group"><h3>Status sinkronisasi perangkat</h3>${queue()}</section></div><div><section class="group"><h3>Data pemulihan perangkat</h3><p>Arsip JSON untuk akun, outlet dan perangkat ini. Termasuk operasi lokal yang dipertahankan dan draf, bukan seluruh data server.</p><p class="muted">Bukan CSV laporan atau cadangan server. Tidak berisi kredensial. Pilih tujuan pribadi; checksum bukan enkripsi atau tanda tangan.</p><button class="primary" data-action="export" ${s.busy?'disabled':''}>Ekspor data perangkat</button></section><section class="group"><h3>Sesi akun</h3><p>Keluar bukan cara memperbaiki sinkronisasi. Data lokal tetap disimpan.</p><button class="danger" data-action="signout" ${s.busy||s.modal?'disabled':''}>Keluar dari akun</button></section></div></div>`;
}
function modal(){const host=$('#modal');host.className=large?'large':'';$('#device').inert=!!s.modal;if(!s.modal){host.innerHTML='';return;}
 const context=`<p>${esc(identity().email)} · Outlet ${source.toUpperCase()} · ${names[actor]}</p><code>${deviceId}</code>`;
 let title='',body='',actions='';
 if(s.modal==='explain'){title='Ekspor data perangkat?';body=context+'<p>Arsip berisi payload asli, ID operasi/struk, status pengiriman dan draf untuk cakupan ini. Termasuk data SYNCED yang dipertahankan untuk rekonsiliasi.</p><p class="notice warning">Pilih tujuan pribadi. SHA-256 memeriksa integritas, bukan enkripsi, keaslian atau izin impor. Maksimal 16 MiB UTF-8. Tidak ada pemulihan otomatis.</p>';actions='<button data-action="cancel">Batal</button><button class="primary" data-action="capture">Siapkan arsip</button>';}
 if(s.modal==='capture'){title='Menyiapkan arsip…';body=context+'<p>Native mengambil snapshot Room konsisten, memeriksa cakupan, ukuran dan integritas. Halaman ini hanya menyimulasikan metadata.</p>';actions='<button data-finish="success">Simulasi siap</button><button data-action="too-large">Simulasi terlalu besar</button><button data-action="provider-fail">Simulasi gagal</button>';}
 if(s.modal==='picker'){title='Ilustrasi pemilih tujuan Android';body=context+`<p>Snapshot ditangkap ${s.prepared.capturedAt}. Perubahan antrean sesudahnya tidak masuk arsip ini.</p><p>Native memakai CreateDocument(application/json). Ini bukan pengelola berkas; tidak ada file dibuat oleh halaman.</p>`;actions='<button data-action="cancel">Simulasi batal</button><button data-action="provider-fail">Simulasi provider gagal</button><button class="primary" data-action="write">Simulasi pilih tujuan</button>';}
 if(s.modal==='write'){title='Menulis arsip…';body=context+'<p>Native memeriksa izin sebelum membuka provider dan setelah tulis/tutup. Kegagalan dapat meninggalkan file kosong/parsial; jangan gunakan file tersebut.</p>';actions='<button data-finish="success">Simulasi selesai</button><button data-action="provider-fail">Simulasi gagal tulis</button><button data-action="authority-loss">Simulasi akses hilang</button>';}
 if(s.modal==='signout'){title='Keluar dari akun?';const c=s.counts;body=context+`<p>Keluar menghapus izin masuk lokal. Struk dan antrean lokal tetap disimpan, tetapi pengiriman memerlukan masuk kembali dengan akun dan perangkat yang berwenang.</p><p class="notice warning">${c?`Menunggu ${c.pending+c.retrying} · perlu akses ${c.auth} · perlu ditinjau ${c.review}.`:'Keadaan antrean belum dapat dipastikan.'} Keluar bukan cara memperbaiki sinkronisasi atau data server yang dipulihkan.</p>`;actions='<button data-action="cancel">Batal</button><button data-action="export-first">Kembali untuk ekspor</button><button class="danger" data-action="confirm-signout">Keluar dari akun</button>';}
 host.innerHTML=`<div class="dialog-overlay"><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title"><div class="dialog-body"><h2 id="dialog-title">${title}</h2>${body}</div><footer class="dialog-footer">${actions}</footer></section></div>`;
}
function focusModal(){$('#modal button')?.focus();}
function render(){const nav=actor==='CASHIER'?'<span>Kasir</span><span>Riwayat</span><span class="current">Setelan</span>':'<span>Ringkasan</span><span>Katalog</span><span>Laporan</span><span>Staf</span><span class="current">Setelan</span>';$('#device').className=`device ${mode}${large?' large':''}`;$('#phone').setAttribute('aria-pressed',mode==='phone');$('#tablet').setAttribute('aria-pressed',mode==='tablet');$('#large').setAttribute('aria-pressed',large);$('#late').disabled=!late;$('#advance').disabled=!s.counts;$('#scene').innerHTML=!allowed()?`<main class="main">${content()}</main>`:`<div class="shell"><nav class="rail" aria-label="Navigasi contoh">${nav}</nav><div class="workspace"><header class="context"><svg class="icon" aria-hidden="true" viewBox="0 0 960 960"><path d="M433,880Q406,880 386.5,862Q367,844 363,818L354,752Q341,747 329.5,740Q318,733 307,725L245,751Q220,762 195,753Q170,744 156,721L109,639Q95,616 101,590Q107,564 128,547L181,507Q180,500 180,493.5Q180,487 180,480Q180,473 180,466.5Q180,460 181,453L128,413Q107,396 101,370Q95,344 109,321L156,239Q170,216 195,207Q220,198 245,209L307,235Q318,227 330,220Q342,213 354,208L363,142Q367,116 386.5,98Q406,80 433,80L527,80Q554,80 573.5,98Q593,116 597,142L606,208Q619,213 630.5,220Q642,227 653,235L715,209Q740,198 765,207Q790,216 804,239L851,321Q865,344 859,370Q853,396 832,413L779,453Q780,460 780,466.5Q780,473 780,480Q780,487 780,493.5Q780,500 778,507L831,547Q852,564 858,590Q864,616 850,639L802,721Q788,744 763,753Q738,762 713,751L653,725Q642,733 630,740Q618,747 606,752L597,818Q593,844 573.5,862Q554,880 527,880L433,880ZM440,800L519,800L533,694Q564,686 590.5,670.5Q617,655 639,633L738,674L777,606L691,541Q696,527 698,511.5Q700,496 700,480Q700,464 698,448.5Q696,433 691,419L777,354L738,286L639,328Q617,305 590.5,289.5Q564,274 533,266L520,160L441,160L427,266Q396,274 369.5,289.5Q343,305 321,327L222,286L183,354L269,418Q264,433 262,448Q260,463 260,480Q260,496 262,511Q264,526 269,541L183,606L222,674L321,632Q343,655 369.5,670.5Q396,686 427,694L440,800ZM482,620Q540,620 581,579Q622,538 622,480Q622,422 581,381Q540,340 482,340Q423,340 382.5,381Q342,422 342,480Q342,538 382.5,579Q423,620 482,620ZM480,480L480,480Q480,480 480,480Q480,480 480,480L480,480L480,480L480,480Q480,480 480,480Q480,480 480,480Q480,480 480,480Q480,480 480,480L480,480L480,480L480,480Q480,480 480,480Q480,480 480,480L480,480L480,480L480,480Q480,480 480,480Q480,480 480,480L480,480L480,480L480,480Q480,480 480,480Q480,480 480,480Q480,480 480,480Q480,480 480,480L480,480L480,480L480,480Q480,480 480,480Q480,480 480,480L480,480L480,480Z"/></svg><div><strong>Outlet ${source.toUpperCase()}</strong><small>${names[actor]} · ${s.scene==='offline'?'Akses offline contoh':'Akses online contoh'}</small></div></header><main class="main">${content()}</main><nav class="bottom" aria-label="Navigasi contoh">${nav}</nav></div></div>`;modal();}
function action(e){const b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.finish){finish(b.dataset.finish);if(s.modal)focusModal();return;}switch(b.dataset.action){case 'retry':case 'validate':case 'read':request(b.dataset.action);break;case 'export':openExport();break;case 'cancel':cancel();break;case 'capture':startCapture();break;case 'too-large':failExport('large');break;case 'provider-fail':failExport('provider');break;case 'write':startWrite();break;case 'authority-loss':reset('denied');break;case 'signout':if(!s.busy){s.modal='signout';render();focusModal();}break;case 'export-first':cancel();$('#scene [data-action=export]')?.focus();break;case 'confirm-signout':s.signedOut=true;s.modal=null;s.prepared=null;s.request=null;generation++;s.message='';render();break;}}
$('#scene').onclick=action;$('#modal').onclick=action;
document.addEventListener('keydown',e=>{if(!s.modal)return;if(e.key==='Escape'){e.preventDefault();cancel();}else if(e.key==='Tab'){const nodes=[...$('#modal').querySelectorAll('button')].filter(n=>!n.disabled);if(e.shiftKey&&document.activeElement===nodes[0]){e.preventDefault();nodes.at(-1).focus();}else if(!e.shiftKey&&document.activeElement===nodes.at(-1)){e.preventDefault();nodes[0].focus();}}});
$('#actor').onchange=e=>{actor=e.target.value;$('#scenario').value='ready';reset();};$('#source').onchange=e=>{source=e.target.value;$('#scenario').value='ready';reset();};$('#scenario').onchange=e=>reset(e.target.value);$('#phone').onclick=()=>{mode='phone';render();};$('#tablet').onclick=()=>{mode='tablet';render();};$('#large').onclick=()=>{large=!large;render();};$('#reset').onclick=()=>{$('#scenario').value='ready';reset();};$('#late').onclick=()=>finish('success',late);$('#advance').onclick=()=>{if(s.counts){s.counts.pending++;render();}};window.settingsDemo={snapshot:()=>clone(s),finishLate:()=>finish('success',late)};reset();
</script></body></html>
